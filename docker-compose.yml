version: '3.8'

# Define top-level networks
networks:
  app-network:
    driver: bridge

# Define top-level volumes
# Docker Compose will create these automatically if they don't exist when you run 'docker compose up'
volumes:
  open-webui:
  searxng-docker_caddy-config:
  searxng-docker_caddy-data:
  searxng-docker_valkey-data2:
  n8n_data:
  comfyui_data: # New volume for ComfyUI persistent data
  
# Define services
services:
  # --- 1. Open WebUI Service ---
  open-webui:
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui:latest
    platform: linux/arm64
    restart: always
    environment:
      - OPENAI_API_BASE_URL=http://host.docker.internal:1234/v1
      - OPENAI_API_KEY=${OPENAI_API_KEY} # From .env file
      - WEBUI_SEARCH_ENGINE_URL=http://searxng-caddy:8080/search?q=<query>
      - HOST_GATEWAY_IP=host.docker.internal
      - WEBUI_TTS_BASE_URL=http://tts-piper:8000 # Pre-configure TTS Piper
      - WEBUI_TTS_API_PATH=/v1/tts # Pre-configure TTS Piper API path
      - WEBUI_COMFYUI_BASE_URL=http://comfyui:8188 # Pre-configure ComfyUI
    volumes:
      - open-webui:/app/backend/data
      - ./my_custom_tools:/app/backend/tools # For custom tool scripts (e.g., pipes)
      # Removed: /Users/imranali/projects:/mnt/projects as it's an absolute host path
    ports:
      - "3000:8080"
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway" # Allows access to services on the Docker host
    depends_on:
      - searxng-caddy

  # --- 2. Tika Content Extraction Service ---
  tika:
    container_name: tika
    image: apache/tika:latest-full
    platform: linux/arm64
    restart: always
    ports:
      - "9998:9998"
    networks:
      - app-network

  # --- 3. Hybrid Reranker Service ---
  hybridreranker:
    container_name: hybridreranker
    # This now builds the 're-ranker:latest' image from the Dockerfile in the 'hybridreranker' directory.
    build:
      context: ./hybridreranker
      dockerfile: Dockerfile
    image: re-ranker:latest # This specifies the name of the image that will be built and used
    platform: linux/arm64
    restart: always
    ports:
      - "8999:8999"
    networks:
      - app-network

  # --- 4. TTS Piper Model Service ---
  tts-piper:
    container_name: openedai-speech
    image: ghcr.io/matatonic/openedai-speech-min:latest
    platform: linux/arm64
    restart: always
    ports:
      - "8000:8000"
    volumes:
      # These now expect 'openedai-speech' directory to be alongside your docker-compose.yml
      - ./openedai-speech/voices:/app/voices
      - ./openedai-speech/config:/app/config
    networks:
      - app-network

  # --- 5. SearXNG Search Engine (and its dependencies) ---
  searxng:
    container_name: searxng
    image: searxng/searxng:latest
    platform: linux/arm64
    restart: always
    environment:
      - SEARXNG_HOSTNAME=searxng-caddy
      - SEARXNG_BASE_URL=/
    volumes:
      # This now expects 'searxng-docker' directory to be alongside your docker-compose.yml
      - ./searxng-docker/searxng:/etc/searxng:rw
    networks:
      - app-network
    depends_on:
      - searxng-redis

  searxng-caddy:
    container_name: searxng-caddy
    image: caddy:2-alpine
    platform: linux/arm64
    restart: always
    volumes:
      - searxng-docker_caddy-config:/config
      - searxng-docker_caddy-data:/data
    ports:
      - "8080:8080"
    networks:
      - app-network
    command: caddy reverse-proxy --from :8080 --to searxng:8080
    depends_on:
      - searxng

  searxng-redis:
    container_name: searxng-redis
    platform: linux/arm64
    image: valkey/valkey:8-alpine
    restart: always
    volumes:
      - searxng-docker_valkey-data2:/data
    networks:
      - app-network

  # --- 6. n8n server ---
  n8n:
    container_name: n8n
    image: n8nio/n8n:latest
    platform: linux/arm64
    restart: always
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n # Persistent storage for n8n data
    environment:
      - N8N_SECURE_COOKIE=false
      - N8N_HOST=n8n
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678
    networks:
      - app-network

  # --- 7. Cloudflare Tunnel Service ---
  cloudflared:
    container_name: cloudflared-tunnel
    image: cloudflare/cloudflared:latest
    platform: linux/arm64
    restart: always
    environment: # Token now pulled from .env for security
      - CLOUDFLARED_TOKEN=${CLOUDFLARED_TOKEN}
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN} # Use the env var here
    networks:
      - app-network

  # --- 8. ComfyUI Service ---
  comfyui:
    container_name: comfyui
    build: # Build the image from your local ComfyUI folder
      context: ./ComfyUI
      dockerfile: Dockerfile
    image: comfyui:latest # Name of the image to be built
    platform: linux/arm64 # Match your other ARM services
    restart: always
    ports:
      - "8188:8188" # Default ComfyUI UI port
    volumes:
      # Persistent storage for ComfyUI's user data, custom nodes, etc.
      - comfyui_data:/app/ComfyUI/data
      # Map model/output/input directories from local host (for easy access/management)
      - ./ComfyUI/models:/app/ComfyUI/models
      - ./ComfyUI/output:/app/ComfyUI/output
      - ./ComfyUI/input:/app/ComfyUI/input
      - ./ComfyUI/custom_nodes:/app/ComfyUI/custom_nodes
    networks:
      - app-network